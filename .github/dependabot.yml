version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Dependency bumps change Cargo.toml, which the documentation check maps to pages.
    labels: [dependencies, docs-not-needed]
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # @astrojs/check accepts TypeScript 5 and 6 only.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/api-check
    schedule:
      interval: weekly
    groups:
      api-check:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
