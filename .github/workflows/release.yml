name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Tools that `mise exec` installs call the GitHub API; unauthenticated calls share a small
  # rate limit per runner IP, which macOS runners exhaust.
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            exe: .exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Git Bash on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: rust

      # mise drives rustup with RUSTUP_TOOLCHAIN set to the version pinned in mise.toml.
      - name: Add the build target
        run: mise exec -- rustup target add "${{ matrix.target }}"

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: mise exec -- cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        run: |
          name="bagkit-${{ matrix.target }}"
          archive="$name.${{ matrix.archive }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/bagkit${{ matrix.exe }}" LICENSE README.md "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$archive" "$name" >/dev/null
          else
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bagkit-${{ matrix.target }}
          path: bagkit-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish-crate:
    needs: release
    runs-on: ubuntu-24.04
    # crates.io only issues a token to this repository's release.yml running in the
    # crates-io environment, which accepts v* tags only.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      # A version published by hand, such as the first one before trusted publishing could be
      # set up, or by an earlier run of this workflow, is left as it is.
      - name: Check whether this version is on crates.io
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'bagkit release workflow (https://github.com/dstotijn/bagkit)' \
            "https://crates.io/api/v1/crates/bagkit/$version")
          case "$status" in
          200) echo "bagkit $version is already on crates.io"; echo "exists=true" >> "$GITHUB_OUTPUT" ;;
          404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
          *) echo "crates.io answered $status" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.published.outputs.exists == 'false'
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        if: steps.published.outputs.exists == 'false'
        with:
          install_args: rust
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.published.outputs.exists == 'false'
        id: auth
      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        run: mise exec -- cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
