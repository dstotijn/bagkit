# cargo-deny configuration: run `cargo deny check` (pinned in mise.toml).

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory: vulnerabilities, unmaintained and unsound crates.
ignore = []

[licenses]
# Permissive licenses compatible with distributing bagkit under MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # tiny-keccak, through parquet -> ahash -> const-random.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
