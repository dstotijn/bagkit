<!doctype html>
<!-- The Open Graph image, rendered to public/og.png by scripts/og.mjs: the wordmark and the first
     sentence of the tagline beside the address network map, in the landing page's anchor-point
     mosaic, with the formats, the repository and the licence along the bottom, in the light
     theme. -->
<meta charset="utf-8" />
<style>
	@font-face {
		font-family: Inter;
		src: url(../public/fonts/InterVariable.woff2);
		font-weight: 100 900;
	}
	@font-face {
		font-family: Paper;
		src: url(../public/fonts/PaperMono-Variable.woff2);
		font-weight: 100 800;
	}
	:root {
		--inset: 40px;
		--split: 690px;
		--strip: 92px;
		--line: #dcdcdc;
		--anchor: 11px;
	}
	* {
		box-sizing: border-box;
		margin: 0;
	}
	html,
	body {
		width: 1200px;
		height: 630px;
		overflow: hidden;
	}
	body {
		position: relative;
		background: #fff;
		font-family: Inter;
		font-feature-settings: 'cv11';
		-webkit-font-smoothing: antialiased;
	}
	.mono {
		font-family: Paper;
		font-feature-settings: 'cv01';
	}
	.logo {
		display: inline-block;
		padding: 0.04em 0.2em 0.1em;
		background: #0044ff;
		color: #fff;
		font-family: Paper;
		font-feature-settings: 'cv01';
		font-size: 124px;
		font-style: italic;
		font-weight: 500;
		line-height: 1;
		letter-spacing: -0.04em;
	}
	.tagline {
		margin-top: 32px;
		color: #666;
		font-size: 38px;
		font-weight: 500;
		line-height: 1.18;
		letter-spacing: -0.025em;
	}
	.map,
	.flow {
		position: absolute;
		left: calc(var(--split) + 16px);
		top: 52px;
		width: calc(1200px - var(--split) - 72px);
		height: calc(630px - 104px - var(--strip));
		mask: url(../public/netherlands.svg) center / contain no-repeat;
	}
	.map {
		background: #9a9a9a;
		opacity: 0.7;
	}
	.flow {
		background: hsl(224, 100%, 45%);
		mask-image: url(../public/netherlands-flow.svg);
	}
	.frame,
	.v,
	.h {
		position: absolute;
		border: 0 solid var(--line);
	}
	.frame {
		inset: var(--inset);
		border-width: 1.5px;
	}
	.v {
		left: var(--split);
		top: var(--inset);
		bottom: calc(var(--inset) + var(--strip));
		border-left-width: 1.5px;
	}
	.h {
		left: var(--inset);
		right: var(--inset);
		bottom: calc(var(--inset) + var(--strip));
		border-top-width: 1.5px;
	}
	.strip {
		position: absolute;
		left: 96px;
		right: 96px;
		bottom: var(--inset);
		height: var(--strip);
		display: flex;
		align-items: center;
		justify-content: space-between;
		color: #707070;
		font-size: 22px;
	}
	.repo {
		display: flex;
		align-items: center;
		gap: 12px;
	}
	.anchor {
		position: absolute;
		z-index: 2;
		width: var(--anchor);
		height: var(--anchor);
		margin: calc(var(--anchor) / -2) 0 0 calc(var(--anchor) / -2);
		border: 1.5px solid #8a8a8a;
		background: #fff;
	}
</style>
<div class="map"></div>
<div class="flow"></div>
<div class="frame"></div>
<div class="v"></div>
<div class="h"></div>
<div style="position: absolute; left: 96px; top: 118px; width: 560px">
	<div class="logo">bagkit</div>
	<p class="tagline">A toolkit for the Dutch register of addresses and buildings (BAG).</p>
</div>
<div class="strip mono">
	<p>SQLite · CSV · Parquet · HTTP lookups</p>
	<p class="repo">
		<!-- GitHub's mark (Octicons, MIT License). -->
		<svg viewBox="0 0 16 16" width="24" height="24" aria-hidden="true">
			<path
				fill="currentColor"
				d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
			></path>
		</svg>
		dstotijn/bagkit · MIT License
	</p>
</div>
<script>
	// An anchor point on every corner and crossing of the frame's lines.
	const css = getComputedStyle(document.documentElement);
	const [inset, split, strip] = ['--inset', '--split', '--strip'].map((v) =>
		parseFloat(css.getPropertyValue(v)),
	);
	const [w, h] = [1200, 630];
	const y = h - inset - strip;
	for (const [left, top] of [
		[inset, inset],
		[split, inset],
		[w - inset, inset],
		[inset, y],
		[split, y],
		[w - inset, y],
		[inset, h - inset],
		[w - inset, h - inset],
	]) {
		const anchor = document.createElement('div');
		anchor.className = 'anchor';
		anchor.style.left = `${left}px`;
		anchor.style.top = `${top}px`;
		document.body.append(anchor);
	}
</script>
